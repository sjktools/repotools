name: PR Fixes

# Run by hand (Actions → PR Fixes → Run workflow) on an open PR's branch:
# merges the PR's base branch in, runs `just fix`, and pushes the result.
# autofix-comment.yml also runs it when the owner comments `/autofix` on a PR.
on:
  workflow_dispatch:

concurrency:
  group: fix-${{ github.ref }}

jobs:
  # Runs the branch's own justfile and dev dependencies (on a Dependabot PR,
  # at their bumped, untrusted versions), so this job never references
  # AUTOFIX_TOKEN: a runner gets every secret its job uses, and code from an
  # earlier step could read it from a later one. It hands its commits to the
  # push job as a Git bundle instead.
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      head: ${{ steps.commit.outputs.head }}

    steps:
      - name: Find the branch's pull request
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::This workflow must be run on a pull request branch, not a $GITHUB_REF_TYPE."
            exit 1
          fi
          base_branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json baseRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].baseRefName // empty')
          if [ -z "$base_branch" ]; then
            echo "::error::Branch $BRANCH has no open pull request in this repository."
            exit 1
          fi
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"

      # No credentials are kept, as the steps after this run the branch's own
      # justfile and dependencies.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge base branch
        env:
          BASE_BRANCH: ${{ steps.check-pr.outputs.base_branch }}
        run: |
          if ! git merge "origin/$BASE_BRANCH" --no-edit; then
            echo "::error::Merge conflict with base branch $BASE_BRANCH. Please resolve conflicts manually."
            exit 1
          fi

      # Keep version in step with pyproject.toml's [tool.uv] required-version.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"

      # Keep just-version in step with the justfile's minimum-version.
      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Install dependencies
        run: just sync

      - name: Run fixes
        run: just fix

      # Bundles the merge commit even if `just fix` changed nothing.
      - name: Commit changes
        id: commit
        run: |
          git add -u
          if git diff --staged --quiet; then
            echo "No fixes to commit"
          else
            git commit -m "chore: apply automated fixes"
          fi
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "Branch is up to date and needs no fixes"
          else
            git bundle create "$RUNNER_TEMP/fixes.bundle" "$GITHUB_SHA..HEAD"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the fixes
        if: steps.commit.outputs.head
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fixes
          path: ${{ runner.temp }}/fixes.bundle
          retention-days: 1

  # A fresh runner that runs no code from the branch: it checks out the commit
  # the fix job started from, fetches the bundled commits onto it and pushes
  # them. AUTOFIX_TOKEN needs only contents write, without the workflows
  # permission, so a bundle can't change the workflows either.
  push:
    needs: fix
    if: needs.fix.outputs.head
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - name: Check token configuration
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          if [ -z "$AUTOFIX_TOKEN" ]; then
            echo "::error::AUTOFIX_TOKEN secret is not set"
            exit 1
          fi

      # The base branch's history too, which the merge commit's bundle assumes.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the fixes
        uses: actions/download-artifact@v8.0.2
        with:
          name: fixes
          path: ${{ runner.temp }}/fixes

      # Pushes with AUTOFIX_TOKEN, not GITHUB_TOKEN, so the push triggers CI. If
      # the branch moved since the fix job's checkout, the push isn't a
      # fast-forward and fails. No hooks run, as core.hooksPath is empty.
      - name: Push the fixes
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ needs.fix.outputs.head }}
        run: |
          bundle="$RUNNER_TEMP/fixes/fixes.bundle"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" HEAD
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The bundle's head isn't the commit the fix job made."
            exit 1
          fi
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${HEAD_SHA}:refs/heads/${BRANCH}"
