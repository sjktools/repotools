name: PR Fixes on comment

# A PR comment from the repo owner (or, in an organization, a member) that is
# just `/autofix` (whitespace aside) runs the PR Fixes workflow (fix.yml) from
# the default branch on the PR's branch, as running it by hand would. This runs
# no code from the branch, and neither does the dispatch: fix.yml runs main's
# copy of itself, which checks the branch again before using it.
on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    # A cheap pre-filter; the exact match is checked below, as expressions
    # can't trim whitespace.
    # OWNER is a user-owned repository's owner; in an organization's
    # repository its members, owners included, are MEMBER.
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/autofix')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    timeout-minutes: 5

    steps:
      - name: Check the comment is only /autofix
        id: check-comment
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          if [[ $BODY =~ ^[[:space:]]*/autofix[[:space:]]*$ ]]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comment has more than /autofix in it; not running PR Fixes."
          fi

      - name: Run PR Fixes on the PR's branch
        if: steps.check-comment.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Not read from a process substitution, whose failure wouldn't stop the step.
          pr=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository,headRefName,headRefOid \
            --jq '"\(.state) \(.isCrossRepository) \(.headRefOid) \(.headRefName)"')
          read -r state cross_repo head_sha branch <<< "$pr"
          if [ "$state" != OPEN ]; then
            echo "::error::Pull request #$NUMBER is not open."
            exit 1
          fi
          if [ "$cross_repo" != false ]; then
            echo "::error::Pull request #$NUMBER is from a fork, which PR Fixes can't push to."
            exit 1
          fi
          if [ "$branch" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Pull request #$NUMBER's branch is $DEFAULT_BRANCH, which PR Fixes doesn't push to."
            exit 1
          fi
          # The head SHA makes PR Fixes fail if the branch moves on before it
          # starts, rather than fix commits pushed after the comment.
          gh workflow run fix.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f branch="$branch" -f head-sha="$head_sha"
          # PR Fixes has started, so a failed reaction only warns: a red run would
          # suggest commenting again.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=rocket > /dev/null; then
            echo "::warning::Couldn't react to the comment."
          fi
          echo "Started PR Fixes on $branch."
