[project]
name = "repoutils"
version = "0.1.0"
description = "Repository tooling for Python projects that use uv, just and GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
# Deliberately none: projects run repoutils in CI jobs that hold write-capable
# tokens or check out untrusted Dependabot branches, installing repoutils alone
# (`uv run --only-group repoutils`), so it must stay standard library only.
dependencies = []
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/sjktools/repoutils"

[project.scripts]
repoutils = "repoutils.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "diff-cover>=11.0.1",
    "jactionlint>=2.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

# repoutils' own settings for repoutils (it dogfoods its checks).
[tool.repoutils]
default-branch = "main"

[tool.repoutils.long-files]
include = ["*.py"]
limit = 500

# The strings `repoutils added-strings` points out when a PR adds them, as
# coding agents often add them where they aren't needed. Regexes, so that a
# string or test data naming them doesn't match (tests/test_added_strings.py
# checks them).
[tool.repoutils.added-strings]
include = ["*.py"]

# Formatted code has it on a line of its own.
[[tool.repoutils.added-strings.strings]]
regex = '^\s*if (typing\.)?TYPE_CHECKING\b'
name = "if TYPE_CHECKING:"

# A comment, not text inside a one-line string: only whole string literals
# come before the #. ruff reads noqa case-insensitively, and a bare one too.
[[tool.repoutils.added-strings.strings]]
regex = '''^(?:[^"'#]|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')*#\s*(?i:noqa)\b'''
name = "# noqa"

# The repository settings `repoutils repo-settings` checks or changes.
[tool.repoutils.repo-settings]
issues = true
projects = false
wiki = false
discussions = false
pull-requests = true
pull-request-creation = "collaborators"
merge-commit = { allow = false }
squash-merge = { allow = true, title = "pr-title", message = "blank" }
rebase-merge = { allow = false }
allow-auto-merge = true
allow-update-branch = true
delete-branch-on-merge = true
require-web-commit-signoff = false

# The Actions settings `repoutils actions-settings` checks or changes. The
# GITHUB_TOKEN stays read-only, as each job asks for what it needs.
[tool.repoutils.actions-settings]
allowed-actions = "all"
default-token-permissions = "read"
fork-pr-approval = "first-time-contributors"
retention-days = 90

[tool.repoutils.actions-settings.oidc]
immutable-subject = true

# The security settings `repoutils security-settings` checks or changes.
# Secret and push protection are free for a public repository and have no
# effect on CI. CodeQL default setup stays off, as it would add its own checks.
[tool.repoutils.security-settings]
private-vulnerability-reporting = false
dependabot-alerts = true
dependabot-security-updates = false
codeql-default-setup = false
secret-protection = true
push-protection = true

# The secrets `repoutils secrets` checks the repository has (see AGENTS.md).
[tool.repoutils.secrets]
actions = ["AUTOFIX_TOKEN", "CLAUDE_CODE_OAUTH_TOKEN"]
dependabot = ["DEPENDABOT_FIX_TOKEN"]
# Only main's workflows can reach these: ci.yml's release job pushes v* tags
# with the deploy key, and bump-version.yml uses GH_ACTIONS_TOKEN.
environments.release = ["GH_ACTIONS_TOKEN", "RELEASE_DEPLOY_KEY"]

# The deployment environments `repoutils environments` checks or creates.
# Only main can deploy to release, which holds the secrets that can tag a
# release or push a branch (ci.yml's release job and bump-version.yml), so a
# branch's own copy of a workflow can't read them.
[tool.repoutils.environments.release]
deployment-branches = "selected"
allowed-branches = ["main"]

# publish-pypi.yml's environments. Only a v* tag (a release) may deploy to pypi, so a run of
# a PR branch's copy of the workflow (which /testpypi dispatches) can't publish
# to PyPI through trusted publishing; testpypi stays open for /testpypi.
[tool.repoutils.environments.pypi]
deployment-branches = "selected"
allowed-branches = []
allowed-tags = ["v*"]

[tool.repoutils.environments.testpypi]
deployment-branches = "all"

# The rulesets `repoutils rulesets` checks or creates, each giving only
# what differs from a new ruleset's defaults. main changes only by a squash-merged
# PR whose CI passed: every test job (GitHub counts a skipped required check as
# passed, so check-and-build, which needs them, isn't enough alone) and the rest
# of ci.yml (check-and-build isn't named build, as attestations.yml has one). Admins
# may bypass that for a PR, but nobody can push to main directly or delete it.
[tool.repoutils.rulesets.main]
include = ["~DEFAULT_BRANCH"]
bypass = [{ role = "admin", mode = "pull-request" }]

[tool.repoutils.rulesets.main.rules]
deletion = true
non-fast-forward = true

[tool.repoutils.rulesets.main.rules.pull-request]
allowed-merge-methods = ["squash"]

[tool.repoutils.rulesets.main.rules.required-status-checks]
# "Require branches to be up to date before merging", so a PR's checks ran against what it merges into.
strict-required-status-checks-policy = true
required-status-checks = [
    { context = "test (ubuntu-latest, 3.12)", app = "github-actions" },
    { context = "test (ubuntu-latest, 3.13)", app = "github-actions" },
    { context = "test (ubuntu-latest, 3.14)", app = "github-actions" },
    { context = "test (ubuntu-latest, 3.15)", app = "github-actions" },
    { context = "test (macos-latest, 3.12)", app = "github-actions" },
    { context = "test (macos-latest, 3.13)", app = "github-actions" },
    { context = "test (macos-latest, 3.14)", app = "github-actions" },
    { context = "test (macos-latest, 3.15)", app = "github-actions" },
    { context = "check-and-build", app = "github-actions" },
    { context = "coverage", app = "github-actions" },
    { context = "actions-lock", app = "github-actions" },
    # These three report on the PR, but also run repoutils' own long-files,
    # added-strings and post-patch-coverage, so they fail if a PR breaks one.
    { context = "long-files", app = "github-actions" },
    { context = "added-strings", app = "github-actions" },
    { context = "post-patch-coverage", app = "github-actions" },
]

# Release tags (see #24). Nobody can move or delete a v* tag, admins included:
# a faulty release is fixed by a new one. Only deploy keys can create one,
# which is how ci.yml's release job tags a release. They're two rulesets because a
# bypass covers every rule in its ruleset.
[tool.repoutils.rulesets.release-tags-immutable]
target = "tag"
include = ["v*"]

[tool.repoutils.rulesets.release-tags-immutable.rules]
update = true
deletion = true

[tool.repoutils.rulesets.release-tags-create]
target = "tag"
include = ["v*"]
bypass = [{ deploy-keys = true }]

[tool.repoutils.rulesets.release-tags-create.rules]
creation = true

# The issue and PR labels `repoutils labels` checks or creates, as exolot and
# taxtracker use them (see AGENTS.md); .github/dependabot.yml applies two.
[[tool.repoutils.labels]]
name = "type:bug"
color = "d73a4a"
description = "Something behaves wrongly"

[[tool.repoutils.labels]]
name = "type:feature"
color = "0e5a8a"
description = "New capability, such as a new command"

[[tool.repoutils.labels]]
name = "type:improvement"
color = "1d76db"
description = "Makes something that already works better"

[[tool.repoutils.labels]]
name = "type:maintenance"
color = "5319e7"
description = "Refactors, dead code, CI, dependencies; no visible change"

[[tool.repoutils.labels]]
name = "type:docs"
color = "0075ca"
description = "Documentation only"

[[tool.repoutils.labels]]
name = "priority:p0"
color = "b60205"
description = "Drop everything: a release is broken or a check passes or fails wrongly"

[[tool.repoutils.labels]]
name = "priority:p1"
color = "e99695"
description = "Do next"

[[tool.repoutils.labels]]
name = "priority:p2"
color = "f9d0c4"
description = "Worth doing when convenient"

[[tool.repoutils.labels]]
name = "priority:p3"
color = "ededed"
description = "Someday/maybe"

[[tool.repoutils.labels]]
name = "size:s"
color = "c2e0c6"
description = "One small PR"

[[tool.repoutils.labels]]
name = "size:m"
color = "7fd18b"
description = "One PR that needs some design"

[[tool.repoutils.labels]]
name = "size:l"
color = "0e8a16"
description = "Several PRs: should become a parent issue with sub-issues"

[[tool.repoutils.labels]]
name = "concern:security"
color = "fbca04"
description = "Security risk or hardening"

[[tool.repoutils.labels]]
name = "concern:breaking"
color = "e4a11b"
description = "Changes commands, options, config or exit codes that projects rely on"

[[tool.repoutils.labels]]
name = "question"
color = "d876e3"
description = "Further information is requested"

[[tool.repoutils.labels]]
name = "dependencies"
color = "0366d6"
description = "Dependabot's dependency updates"

# Refuse uv versions older than CI's, which may resolve or write uv.lock differently.
# Keep in step with the setup-uv `version` in .github/workflows.
[tool.uv]
required-version = ">=0.13.6"
# Development (the dev group's wheels in uv.lock) is supported on macOS and
# Linux x86_64/aarch64 only; repoutils itself is pure Python and runs anywhere.
# `repoutils check-lock-platforms` checks uv.lock keeps to these.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PLC0415", "RUF100"]

[tool.mypy]
files = ["src", "tests"]
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    "explicit-override",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "-n auto"

[tool.coverage.run]
source = ["repoutils"]
branch = true
# Run only as `python -m repoutils`, in a subprocess coverage doesn't measure.
omit = ["*/repoutils/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"
